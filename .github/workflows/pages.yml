name: Deploy to GitHub Pages

# เปิดใช้: Settings > Pages > Source เลือก "GitHub Actions" แล้วผลักโค้ดขึ้นสาขา main (หรือกด Run workflow)
# จะได้เว็บ https://<ชื่อผู้ใช้>.github.io/<ชื่อ repo>/ ที่ติดตั้งลงหน้าจอมือถือได้ (PWA)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # ล็อกอิน/สำรองข้ามเครื่อง (ไม่บังคับ): ตั้งที่ Settings > Secrets and variables > Actions > Variables
      # ไม่ตั้ง = แอปทำงานแบบไม่มีบัญชีเหมือนเดิม (ค่าเหล่านี้ไม่ใช่ความลับ แต่ต้องจำกัดโดเมนใน Firebase)
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_CLOUD_PROVIDERS: ${{ vars.VITE_CLOUD_PROVIDERS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
